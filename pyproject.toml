[project]
name = "showdown"
version = "0.0.1.dev0"
description = "Heads-up poker lab: CFR solver, equity engine, push/fold bot, hand-history analyzer"
readme = "README.md"
# pokerkit needs >=3.11; eval7 0.1.11 has no wheel above cp312 (DECISIONS 10).
requires-python = ">=3.11,<3.13"
authors = [{ name = "Ian Menachery" }]

# Borrowed commodity parts, pinned to the versions the 2026-11-14 spike checked
# (DECISIONS 3-5). Bump only with a DECISIONS entry.
dependencies = [
  "pokerkit==0.7.7",
  "eval7==0.1.11",
]

[project.optional-dependencies]
dev = [
  # Test oracles only, never imported from src/ (DECISIONS 6).
  "open_spiel==2.0.2",
  "phevaluator==0.6.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
# The screen reader (DECISIONS 30): pinned when installed. Pillow and the OCR bindings
# join when spike S1's reader needs them.
live = [
  "mss==10.2.0",
]

[project.scripts]
showdown = "showdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (over ~10 s) are gate evidence, run with `py gate.py --full`.
addopts = "-q -m 'not slow'"
markers = ["slow: gate evidence that takes more than ~10 s; run with py gate.py --full"]
filterwarnings = [
  # eval7's range parser (which we never call) uses deprecated pyparsing names.
  "ignore::DeprecationWarning:eval7.*",
]

[tool.coverage.run]
source = ["showdown"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines: 37 existing; keeps the edit-time lint hook on real problems
