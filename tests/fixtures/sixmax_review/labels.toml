# Gate W, bar 1 (DECISIONS 58): six-max hands written and labelled by hand before the
# review classifier existed. All are fictional. The player is "Hero" in every hand.
#
# Blinds are 1/2 chips unless a hand's comment says otherwise, so 1 bb = 2 chips. Seats in
# pokerkit's order: p1 SB, p2 BB, p3 UTG, p4 HJ, p5 CO, p6 BTN.
#
# A graded hand gives seat, limpers (non-blind 1 bb calls ahead of Hero), ante (bb),
# hand (class), kind (fold, limp or raise; limp covers limp, overlimp, complete and
# check) and, for a raise, size (raise-to in bb). A skipped hand gives its cause, the first
# that applies in DECISIONS 58's order. "absent" means Hero is not in the hand.
# PokerStars hands are keyed "<file stem>#<hand number in the file>".

