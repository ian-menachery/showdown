# Gate G fixture (DECISIONS 32): 42 spots for the V1 advisor, run with the fixed
# top-% ranges (DECISIONS 35). The 43rd, AsKd first in at 40 bb, moved to
# model_spots.toml when the preflop model began answering it.
#
# River and turn spots: the equity is counted by hand, with the count beside
# the spot, and the action follows from DECISIONS 32's rules:
# - facing a bet: call if equity >= to_call / (pot + to_call) + 0.05;
# - free to bet: bet at 60% equity or more (75% of the pot on the river,
#   66% on the turn), else check;
# - "equity" mode: no action.
# Preflop spots: the expected action is the push/fold solution's pure action,
# checked against data/pushfold.json in the test. Flop spots: the Monte Carlo
# equity must land within 3 SE of exact enumeration, and the action must
# match exact equity.

[[river]]
id = "r1_top_pair_vs_sets_and_two_pair"
# Villain QQ: 3 combos (Qd on board) beat us with a set. AK: 3 aces x 2 kings
# = 6 combos tie (both play K-K-A-Q-7). KQ: 2 kings x 3 queens = 6 combos beat
# us with two pair. 15 combos, so equity = 3 / 15. The threshold is
# 5 / 15 + 0.05 = 0.3833, so fold.
hero = "AsKs"
board = "KhQd7c2s3h"
seat = "bb"
pot = 10.0
to_call = 5.0
villain = "QQ,AK,KQ"
equity = 0.2
action = "fold"

[[river]]
id = "r2_value_bet_vs_jj"
# All 6 JJ combos lose to our kings: equity 1. Free to bet: bet 75% of 10.
hero = "AsKs"
board = "KhQd7c2s3h"
seat = "bb"
pot = 10.0
to_call = 0.0
villain = "JJ"
equity = 1.0
action = "bet"
size = 7.5

[[river]]
id = "r3_board_broadway_chop"
# Broadway on the board, and 22 cannot beat it: all 6 combos chop, equity 0.5.
# The threshold is 10 / 30 + 0.05 = 0.3833, so call.
hero = "4c5d"
board = "AhKhQdJcTs"
seat = "sb"
pot = 20.0
to_call = 10.0
villain = "22"
equity = 0.5
action = "call"

[[river]]
id = "r4_equity_mode"
# As r2, in equity mode: no action hint.
hero = "AsKs"
board = "KhQd7c2s3h"
seat = "bb"
pot = 10.0
to_call = 0.0
villain = "JJ"
mode = "equity"
equity = 1.0

[[river]]
id = "r5_kings_with_queen_kicker"
# Board Kd 9s 5h 2c 2d (no flush or straight possible).
# - AK: 4 aces x 2 kings (Ks, Kh) = 8 combos win with an ace kicker.
# - KJ: 2 x 4 = 8 combos lose to our queen kicker.
# - 99: 3 combos make nines full.
# - 55: 3 combos make fives full.
# 22 combos, we win 8: equity 8/22 = 0.3636. The threshold is 4/16 + 0.05 =
# 0.30, so call.
hero = "KcQc"
board = "Kd9s5h2c2d"
seat = "bb"
pot = 12.0
to_call = 4.0
villain = "AK,KJ,99,55"
equity = 0.36363636363636365
action = "call"

[[turn]]
id = "t1_nut_flush_draw_vs_set"
# 44 rivers. 9 hearts remain, but 2h and 3h pair the board and give QQQ a
# full house. So 7 rivers win and none tie: 7/44. Against a threshold of
# 10/30 + 0.05, fold.
hero = "AhKh"
board = "Qh7h2c3s"
seat = "sb"
pot = 20.0
to_call = 10.0
villain = "QsQd"
equity = 0.1590909090909091
action = "fold"

[[turn]]
id = "t2_open_ender_vs_aces"
# Four 5s and four 10s make our straight: 8 of 44 rivers, for each of the
# 6 AA combos. Only 3 spades can come, so no flush. Free to bet, 8/44 < 0.6:
# check.
hero = "9s8s"
board = "7s6d2cKh"
seat = "bb"
pot = 6.0
to_call = 0.0
villain = "AA"
equity = 0.18181818181818182
action = "check"

[[turn]]
id = "t3_set_vs_ak"
# AhKh cannot catch up with one card: a pair is not enough, and there are
# only 4 hearts with the Qh. Equity 1. The threshold is 5/20 + 0.05, so call.
hero = "QcQd"
board = "Qh8s3d2c"
seat = "sb"
pot = 15.0
to_call = 5.0
villain = "AhKh"
equity = 1.0
action = "call"

[[turn]]
id = "t4_same_hand_chop"
# AcKd against AsKc on Ah Td 7s 2c: no flush or straight can come, so every
# river chops. Equity 0.5. The threshold is 10/40 + 0.05 = 0.30, so call.
hero = "AcKd"
board = "AhTd7s2c"
seat = "bb"
pot = 30.0
to_call = 10.0
villain = "AsKc"
equity = 0.5
action = "call"

[[turn]]
id = "t5_nut_flush_draw_bet_check"
# As t1, but free to bet: 7/44 < 0.6, so check.
hero = "AhKh"
board = "Qh7h2c3s"
seat = "sb"
pot = 20.0
to_call = 0.0
villain = "QsQd"
equity = 0.1590909090909091
action = "check"

