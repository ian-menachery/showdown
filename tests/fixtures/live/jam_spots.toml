seat = "bb"
bb = 70
decision = "bb_vs_4bet_jam"
pot = 77.5
to_call = 62.5
villain = "AKo"
equity = 0.54989
price = 0.44642857142857145
action = "call"
ev = 14.4846
notes = ["model chart, R 0.90, 70 bb says call; it agrees"]

