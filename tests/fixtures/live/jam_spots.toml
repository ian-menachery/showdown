# Gate J fixture (DECISIONS 36): the jam-vs-range helper.
#
# Equities come from `showdown matrix show` (5 decimals), weighted by hand by
# the villain combos the hero's cards leave. None of these hands block the
# villain's classes, so each class counts its full combos. price = to_call /
# (pot + to_call). The call is made if equity >= price. EV is relative to
# folding: equity * (pot + to_call) - to_call. "close" means
# |equity - price| < 0.02.

# Fully hand-worked: equity, price, action, EV and notes.
[[worked]]
id = "h1_AKo_vs_QQ_50bb_fold"
# AKo vs QQ 0.43242. Price 49 / 100 = 0.49, so fold. EV = 43.242 - 49 = -5.758.
# The model never reaches a first-in jam at 50 bb, so there is no reference note.
hero = "AhKd"
seat = "bb"
bb = 50
decision = "bb_vs_jam"
pot = 51.0
to_call = 49.0
villain = "QQ"
equity = 0.43242
price = 0.49
action = "fold"
ev = -5.758
notes = []

