[[worked]]
id = "h6_KQs_vs_AJo_25bb_close_fold_vs_model"
# The SB opened and faces the BB's jam at 25 bb: pot 25 + 2.5 = 27.5, to call
# 22.5, price 22.5 / 50 = 0.45. KQs vs AJo 0.43677 < 0.45, so fold. The gap is
# 0.01323, so close. EV = 0.43677 * 50 - 22.5 = -0.6615. The model chart at
# 25 bb, node rj, has KQs = C (call), so folding gains 0.66 bb against this range.
hero = "KhQh"
seat = "sb"
bb = 25
decision = "sb_vs_jam"
pot = 27.5
to_call = 22.5
villain = "AJo"
equity = 0.43677
price = 0.45
action = "fold"
ev = -0.6615
notes = ["close", "model chart, R 0.90, 25 bb says call; against this range folding gains +0.66 bb"]

